name: ClassAI monitor
on:
  schedule: [{cron: "7 5,9,13,17,21 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: classai-git
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ita poppler-utils && pip install pypdf
      - run: python tools/crawl.py
        env: {TG_TOKEN: "${{ secrets.TG_TOKEN }}", TG_CHAT: "${{ secrets.TG_CHAT }}", AI_API_KEY: "${{ secrets.AI_API_KEY }}"}
      - run: python tools/digest.py --ics-only
      - run: |
          git config user.name classai; git config user.email bot@users.noreply.github.com
          git add docs/data docs/cal state
          git diff --cached --quiet || (git commit -m "dati" && git pull --rebase --autostash && git push)
